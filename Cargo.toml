[package]
name = "cmux-rs"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["ZachDreamZ"]
description = "Connection multiplexer for Rust — serve multiple protocols on a single TCP port"
repository = "https://github.com/ZachDreamZ/cmux-rs"
keywords = ["multiplexer", "tcp", "protocol", "connection", "mux"]
categories = ["network"]

[dependencies]
tokio = { version = "1", features = ["net", "io-util", "sync", "macros", "rt", "time"] }
bytes = "1"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tracing-subscriber = "0.3"

[[example]]
name = "simple"
path = "examples/simple.rs"

[[example]]
name = "multi"
path = "examples/multi.rs"
